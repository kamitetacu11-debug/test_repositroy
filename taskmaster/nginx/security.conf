# TaskMaster Nginx Security Configuration
# Include this file in your main nginx.conf: include /path/to/security.conf;

# ============================================================================
# Rate Limiting Zones
# ============================================================================

# Global rate limit zone (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/s;

# API rate limit zone (more restrictive)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Auth endpoints rate limit (very restrictive)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

# Connection limit zone
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ============================================================================
# Security Headers
# ============================================================================

# Add security headers to all responses
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS (only enable if you have SSL configured)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# CSP header (customize based on your needs)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; font-src 'self' https: data:; object-src 'none'; media-src 'self'; frame-src 'none';" always;

# ============================================================================
# Request Filtering
# ============================================================================

# Block common exploit patterns
location ~* "(eval\(|base64_|<script|javascript:|vbscript:|expression\()" {
    return 403;
}

# Block access to hidden files and directories
location ~ /\. {
    deny all;
    return 404;
}

# Block access to backup files
location ~* "\.(bak|backup|old|orig|save|swp|tmp)$" {
    deny all;
    return 404;
}

# Block access to config files
location ~* "\.(env|config|ini|yml|yaml|conf)$" {
    deny all;
    return 404;
}

# Block access to log files
location ~* "\.(log|logs)$" {
    deny all;
    return 404;
}

# Block access to SQL files
location ~* "\.(sql|sqlite|db)$" {
    deny all;
    return 404;
}

# Block access to version control directories
location ~ /\.(git|svn|hg|bzr) {
    deny all;
    return 404;
}

# Block access to node_modules and vendor directories
location ~ /(node_modules|vendor|bower_components)/ {
    deny all;
    return 404;
}

# ============================================================================
# DDoS Protection
# ============================================================================

# Limit request body size
client_max_body_size 10m;

# Limit request header size
large_client_header_buffers 4 8k;

# Connection timeouts
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
send_timeout 10s;

