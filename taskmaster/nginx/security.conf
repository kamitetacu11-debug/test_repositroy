# ============================================================================
# IP Blacklist
# ============================================================================

# Create a file with blocked IPs: /etc/nginx/blocked_ips.conf
# Format: deny 1.2.3.4;
# Include in server block: include /etc/nginx/blocked_ips.conf;

# ============================================================================
# Logging for Security Analysis
# ============================================================================

log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time '
                    '"$http_x_forwarded_for"';

# In server block:
# access_log /var/log/nginx/taskmaster.access.log security;
# error_log /var/log/nginx/taskmaster.error.log warn;
